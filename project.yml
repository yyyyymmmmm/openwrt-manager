name: OpenWrtManager
options:
  bundleIdPrefix: app.openwrtmanager
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  OpenWrtKit:
    path: Packages/OpenWrtKit

targets:
  OpenWrtManager:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: OpenWrtKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openwrtmanager.ios
        PRODUCT_NAME: OpenWrtManager
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_STRICT_CONCURRENCY: minimal
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  OpenWrtManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: OpenWrtManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openwrtmanager.ios.uitests
        TEST_TARGET_NAME: OpenWrtManager
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  OpenWrtManager:
    build:
      targets:
        OpenWrtManager: all
        OpenWrtManagerUITests: [test]
    test:
      config: Debug
      targets:
        - OpenWrtManagerUITests
      gatherCoverageData: true
